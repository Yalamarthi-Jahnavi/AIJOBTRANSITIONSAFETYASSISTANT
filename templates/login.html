{% extends 'base.html' %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-5 animate-fade-in" style="border-top: 5px solid var(--primary-color);">
            <div class="text-center mb-4">
                <i class="fas fa-shield-alt text-primary mb-3" style="font-size: 3rem;"></i>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted">Sign in to access your transition dashboard</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-4">
                    <label for="username" class="form-label fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 bg-light" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 bg-light" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 mb-3">Sign In</button>
                
                <div class="text-center">
                    <span class="text-muted">Don't have an account?</span> <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
